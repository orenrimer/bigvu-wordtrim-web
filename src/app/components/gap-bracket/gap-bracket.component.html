<div class="gap-bracket" 
     [attr.data-state]="gap.state"
     [class.selected]="isSelected"
     [class.ignored]="isIgnored"
     [class.active]="isActive"
     [class.selected-active]="isSelected && isActive"
     [class.selected-ignored]="isSelected && isIgnored"
     [attr.aria-label]="ariaLabel"
     [attr.role]="'button'"
     [attr.aria-pressed]="isSelected"
     (click)="onClick()">
    <span class="gap-bracket-text">{{ displayText }}</span>
</div>
