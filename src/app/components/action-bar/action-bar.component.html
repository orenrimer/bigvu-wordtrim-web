<div class="action-bar" role="toolbar" aria-label="Segment actions">
    <div class="action-bar-content">
        <!-- Action Bar Items -->
        <div class="action-bar-items">

            <!-- Undo Button (Feature 8) -->
            <app-button variant="secondary" class="action-bar-item" borderRadius="var(--radius-xl)"
                [disabled]="!canUndo()" (clicked)="onUndo()" aria-label="Undo last action">
                <div class="action-bar-item">
                    <img src="assets/icons/Undo.svg" alt="" class="action-icon" />
                    <span class="action-label">Undo</span>
                </div>
            </app-button>

            <!-- Redo Button (Feature 8) -->
            <app-button variant="secondary" class="action-bar-item" borderRadius="var(--radius-xl)"
                [disabled]="!canRedo()" (clicked)="onRedo()" aria-label="Redo last undone action">
                <div class="action-bar-item">
                    <img src="assets/icons/Redo.svg" alt="" class="action-icon" />
                    <span class="action-label">Redo</span>
                </div>
            </app-button>

            <!-- Restore Segment (Feature 6 - Conditional Visibility) -->
            @if (canRestore()) {
            <app-button variant="secondary" class="action-bar-item" borderRadius="var(--radius-xl)"
                (clicked)="onRestore()" aria-label="Restore deleted words in selection">
                <div class="action-bar-item">
                    <img src="assets/icons/Restore.svg" alt="" class="action-icon" />
                    <span class="action-label">Restore</span>
                </div>
            </app-button>
            }

            <!-- Fix Start/End (Phase 2 - Placeholder) -->
            <app-button variant="secondary" class="action-bar-item" borderRadius="var(--radius-xl)" [disabled]="true"
                (clicked)="onFixStartEnd()" aria-label="Fix Start/End (Coming in Phase 2)">
                <div class="action-bar-item">
                    <img src="assets/icons/fix_start_end.svg" alt="" class="action-icon" />
                    <span class="action-label">Fix<br />Start/End</span>
                </div>
            </app-button>

            <!-- Remove Gaps (Phase 2 - Placeholder) -->
            <app-button variant="secondary" class="action-bar-item" borderRadius="var(--radius-xl)" [disabled]="true"
                (clicked)="onRemoveGaps()" aria-label="Remove Gaps (Coming in Phase 2)">
                <div class="action-bar-item">
                    <img src="assets/icons/Premium.svg" alt="Premium" class="premium-badge" />
                    <img src="assets/icons/remove_gaps.svg" alt="" class="action-icon" />
                    <span class="action-label">Remove<br />Gaps</span>
                </div>
            </app-button>

            <!-- Remove This Segment (Feature 6 - Conditional Visibility) -->
            @if (showRemove()) {
            <app-button variant="secondary" class="action-bar-item" borderRadius="var(--radius-xl)"
                [disabled]="!canRemove()" (clicked)="onRemove()" aria-label="Remove selected segment">
                <div class="action-bar-item">
                    <img src="assets/icons/remove.svg" alt="" class="action-icon" />
                    <span class="action-label">Remove<br />This</span>
                </div>
            </app-button>
            }

            <!-- Keep Only This Segment (Feature 6 - Conditional Visibility) -->
            @if (showKeepOnly()) {
            <app-button variant="secondary" class="action-bar-item" borderRadius="var(--radius-xl)"
                [disabled]="!canKeepOnly()" (clicked)="onKeepOnly()" aria-label="Keep only selected segment">
                <div class="action-bar-item">
                    <img src="assets/icons/keep_only.svg" alt="" class="action-icon" />
                    <span class="action-label">Keep Only<br />This</span>
                </div>
            </app-button>
            }

            <!-- Unselect (Feature 6) -->
            <app-button variant="secondary" class="action-bar-item" borderRadius="var(--radius-xl)"
                [disabled]="!canUnselect()" (clicked)="onUnselect()" aria-label="Clear selection">
                <div class="action-bar-item">
                    <img src="assets/icons/unselect.svg" alt="" class="action-icon" />
                    <span class="action-label">Unselect</span>
                </div>
            </app-button>

            <!-- Tutorial (Feature 7 - Placeholder) -->
            <app-button variant="secondary" class="action-bar-item" borderRadius="var(--radius-xl)"
                (clicked)="onTutorial()" aria-label="Open tutorial">
                <div class="action-bar-item">
                    <img src="assets/icons/tutorial.svg" alt="" class="action-icon" />
                    <span class="action-label">Tutorial</span>
                </div>
            </app-button>
        </div>
    </div>
</div>
